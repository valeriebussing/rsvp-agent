[project]
name = "rsvp-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "valeriebussing", email = "v.a.bussing@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth>=2.62.2",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
]

[project.scripts]
rsvp-agent = "rsvp_agent.main:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pre-commit>=4.7.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that connect to external services",
]
